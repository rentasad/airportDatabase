services:
  db:
    image: mariadb:12.2.2
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: notSecureChangeMe
      MYSQL_DATABASE: airports
      

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1

  airportDatabaseCreator:
     image: maven:3.8-openjdk-17-slim

     volumes:
      - ./src:/usr/src/airportDatabaseCreator/src
      - ./pom.xml:/usr/src/airportDatabaseCreator/pom.xml
      - ./resources:/usr/src/airportDatabaseCreator/resources
      - ./out:/usr/src/airportDatabaseCreator/out
      - ./maven-repo:/root/.m2
     working_dir: /usr/src/airportDatabaseCreator
     command: mvn compile exec:java
     
